<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SAI2 特效工坊</title>
<style>
:root {
  --bg: rgba(24,26,32,.86);
  --surface: rgba(38,42,50,.90);
  --surface2: rgba(52,57,68,.90);
  --line: rgba(255,255,255,.10);
  --line2: rgba(255,255,255,.18);
  --text: #f2f4f8;
  --dim: #a6acbb;
  --accent: var(--fx-accent, #ff9a3c);
  --accent-soft: rgba(255,154,60,.18);
  --accent-ink: #231404;
  --grid: rgba(255,255,255,.045);
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font: 12.5px/1.5 "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  color: var(--text); background: var(--bg); border: 1px solid var(--line2);
  border-radius: var(--radius); overflow: hidden;
  backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
  font-size: calc(12.5px * var(--font-scale, 1));
}
button, input, select { font: inherit; }
button { cursor: pointer; color: var(--text); }
button:disabled { opacity: .4; cursor: not-allowed; }

/* ---- 40px 顶栏（可拖拽） ---- */
.topbar {
  height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  -webkit-app-region: drag; user-select: none;
}
.topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; flex: none; box-shadow: 0 0 0 3px rgba(255,255,255,.05); }
.topbar .dot.on { background: #54d07a; box-shadow: 0 0 0 3px rgba(84,208,122,.18); }
.topbar b { font-size: 13px; font-weight: 500; }
.topbar .spacer { flex: 1; }
.topbar .tbtn {
  -webkit-app-region: no-drag; border: 1px solid var(--line); background: var(--surface2);
  color: var(--dim); border-radius: 6px; padding: 3px 8px; font-size: 11.5px;
}
.topbar .tbtn:hover { color: var(--text); border-color: var(--line2); }
.seg {
  -webkit-app-region: no-drag; display: flex; gap: 2px; padding: 2px;
  background: var(--surface2); border: 1px solid var(--line); border-radius: 8px;
}
.seg button { border: 0; background: transparent; color: var(--dim); border-radius: 6px; padding: 3px 10px; font-size: 11.5px; }
.seg button.active { background: var(--accent); color: var(--accent-ink); font-weight: 500; }

/* ---- 工作区：48px 图标栏 + 画布 + 240px 检查器 ---- */
.workspace { flex: 1; min-height: 0; display: flex; }
.canvas-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.side {
  width: 48px; flex: none; background: var(--surface); border-right: 1px solid var(--line);
  padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; overflow-y: auto;
}
.side[hidden] { display: none; }
.side .tool {
  position: relative; width: 36px; height: 38px; flex: none; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  border: 0; background: transparent; color: var(--dim); border-radius: 8px;
}
.side .tool svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.side .tool span { font-size: 11.5px; line-height: 1; }
.side .tool:hover { background: var(--surface2); color: var(--text); }
.side .tool.active { background: var(--accent-soft); color: var(--accent); }
.side .tool.active::before { content: ''; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent); }
.side .sep { width: 24px; height: 1px; background: var(--line2); margin: 3px 0; flex: none; }
.side .foot { margin-top: auto; font-size: 11.5px; color: var(--dim); padding: 6px; line-height: 1.4; text-align: center; }

/* ---- 画布 ---- */
.canvas-area {
  flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: crosshair;
  display: flex; align-items: center; justify-content: center;
  background-image:
    linear-gradient(45deg, var(--grid) 25%, transparent 25%, transparent 75%, var(--grid) 75%),
    linear-gradient(45deg, var(--grid) 25%, transparent 25%, transparent 75%, var(--grid) 75%);
  background-size: 18px 18px; background-position: 0 0, 9px 9px;
}
.canvas-area canvas { position: absolute; transform-origin: 0 0; }
.canvas-area #preview { box-shadow: 0 6px 22px rgba(0,0,0,.45); border-radius: 4px; }
.canvas-area #overlay { pointer-events: none; opacity: .6; }
.canvas-area.gray #preview { filter: grayscale(1); }
.empty { color: var(--dim); text-align: center; line-height: 2; font-size: 12.5px; }

/* ---- 画布左上角浮动图层面板 ---- */
.float-panel {
  position: absolute; left: 10px; top: 10px; z-index: 8; width: 132px; padding: 6px;
  background: var(--surface2); border: 1px solid var(--line2); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 11.5px;
}
.float-panel .fp-hd { display: flex; align-items: center; justify-content: space-between; color: var(--dim); padding: 0 2px 4px; font-size: 11.5px; }
.float-panel .fp-hd button { border: 0; background: transparent; color: var(--dim); padding: 0 4px; font-size: 13px; line-height: 1; }
.float-panel.collapsed .fp-bd { display: none; }
.float-panel.collapsed .fp-hd button { transform: rotate(-90deg); }
.fp-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 5px; }
.fp-actions button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 6px; padding: 4px 2px; font-size: 11.5px; }
.fp-actions button.grab { grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 500; }
#layer-list { max-height: 220px; overflow: auto; }
.layer-row { padding: 4px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
.layer-row:hover { background: var(--surface); }
.layer-row.sel { background: var(--accent); color: var(--accent-ink); }

/* ---- 画布右下角画质胶囊 ---- */
.quality-pill {
  position: absolute; right: 10px; bottom: 10px; z-index: 7; display: flex; align-items: center; gap: 7px;
  max-width: calc(100% - 20px); padding: 5px 9px; border-radius: 20px;
  background: var(--surface2); border: 1px solid var(--line2); box-shadow: 0 6px 18px rgba(0,0,0,.3);
  font-size: 11.5px; color: var(--dim);
}
.quality-pill .sep { width: 1px; height: 12px; background: var(--line2); flex: none; }
.quality-pill input[type=range] { width: 76px; accent-color: var(--accent); }
.quality-pill .rgb { color: var(--accent); font-weight: 500; }
.quality-pill .mini { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 5px; padding: 2px 7px; font-size: 11.5px; }

/* ---- 240px 卡片化检查器 ---- */
.inspector {
  width: 240px; flex: none; border-left: 1px solid var(--line); background: var(--bg);
  padding: 8px; overflow-y: auto; min-height: 0;
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
.card[hidden] { display: none; }
.card-hd { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; font-size: 12px; font-weight: 500; cursor: pointer; user-select: none; }
.card-hd .chev { color: var(--dim); transition: transform .15s; }
.card.collapsed .chev { transform: rotate(-90deg); }
.card.collapsed .card-bd { display: none; }
.card-bd { padding: 0 10px 10px; }
.card h3 { margin: 2px 0 8px; font-size: 13px; font-weight: 500; }
.card h4 { margin: 12px 0 6px; font-size: 11.5px; color: var(--dim); font-weight: 500; }
.row { margin-bottom: 9px; }
.row > label { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 11.5px; margin-bottom: 4px; }
.row > label > span:last-child { color: var(--text); font-size: 13px; font-weight: 500; }
.slider-line { display: flex; align-items: center; gap: 6px; }
.slider-line input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.slider-line input[type=number] {
  width: 40px; flex: none; text-align: center; padding: 3px 2px; font-size: 11.5px;
  background: var(--surface2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
}
.row select, .row input[type=text] { width: 100%; background: var(--surface2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font-size: 11.5px; }
.row.checkbox label { justify-content: flex-start; gap: 6px; }
.chipset { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 10px; }
.chip { border: 1px solid var(--line); background: var(--surface2); color: var(--dim); border-radius: 20px; padding: 3px 9px; font-size: 11.5px; }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.grid button { border: 1px solid var(--line); background: var(--surface2); color: var(--text); border-radius: 6px; padding: 6px 2px; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
.grid button.active { border-color: var(--accent); box-shadow: inset 0 -2px var(--accent); }
.grid.thumb { grid-template-columns: repeat(2, 1fr); }
.grid.thumb button { padding: 0; height: 54px; font-size: 11.5px; position: relative; display: flex; align-items: flex-end; justify-content: center; }
.grid.thumb button img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
.grid.thumb button span { position: relative; background: rgba(0,0,0,.6); width: 100%; }
.actions { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
.actions button { flex: 1 1 auto; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: 11.5px; background: var(--surface2); color: var(--text); }
.actions.sub button { padding: 5px 6px; }
.actions button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.editor { width: 100%; background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; touch-action: none; }
.list { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.list div { padding: 5px 8px; border-bottom: 1px solid var(--line); font-size: 11.5px; cursor: pointer; }
.list div:last-child { border-bottom: 0; }
.list div:hover { background: var(--surface2); }
.note { color: var(--dim); font-size: 11.5px; line-height: 1.6; }

/* ---- 36px 底部操作条 ---- */
.bottombar {
  height: 36px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  padding: 0 12px; background: var(--surface); border-top: 1px solid var(--line);
}
.bottombar[hidden] { display: none; }
.bottombar button { border-radius: 7px; padding: 5px 14px; font-size: 11.5px; }
.bottombar .btn-secondary { border: 1px solid var(--line2); background: var(--surface2); color: var(--text); }
.bottombar .btn-primary { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 500; }

/* ---- 工具菜单 / 提示 / 单工具页 ---- */
.tool-menu {
  position: absolute; right: 10px; top: 38px; z-index: 20; min-width: 230px; max-height: 70vh; overflow: auto;
  background: #f7f9fc; color: #20242e; border: 1px solid #d5dae4; border-radius: 8px;
  box-shadow: 0 10px 32px rgba(0,0,0,.35); padding: 6px; font-size: 12px; display: none;
}
.tool-menu.show { display: block; }
.tool-menu .group { padding: 5px 9px 2px; color: #7b8292; font-size: 11.5px; }
.tool-menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: #20242e; padding: 5px 9px; border-radius: 5px; font-size: 12px; }
.tool-menu button:hover { background: #e8edf7; }
.tool-menu hr { border: 0; border-top: 1px solid #e3e7ef; margin: 4px 2px; }
.toast {
  position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%);
  background: rgba(0,0,0,.8); color: #fff; padding: 7px 14px; border-radius: 20px;
  font-size: 11.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30;
}
.toast.show { opacity: 1; }
.solo-hint {
  flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--surface2); border-bottom: 1px solid var(--line); color: var(--dim); font-size: 11.5px;
}
.solo-hint[hidden] { display: none; }
.solo-hint button { margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 5px; padding: 2px 9px; font-size: 11.5px; }

/* ---- 浅色系统兜底：只换变量，不改结构 ---- */
@media (prefers-color-scheme: light) {
  :root {
    --bg: rgba(250,250,252,.88);
    --surface: rgba(255,255,255,.94);
    --surface2: rgba(238,241,246,.96);
    --line: rgba(20,24,32,.12);
    --line2: rgba(20,24,32,.20);
    --text: #20242e;
    --dim: #5c6272;
    --accent-soft: rgba(255,154,60,.22);
    --grid: rgba(20,24,32,.05);
  }
}
</style>
</head>
<body>
<div class="topbar">
  <span class="dot" id="agent-dot"></span><b id="tool-name">液化</b>
  <span class="spacer"></span>
  <div class="seg" id="seg-tabs">
    <button class="active" data-tab="param">参数</button>
    <button data-tab="preset">预设</button>
    <button data-tab="history">历史</button>
  </div>
  <button class="tbtn" id="btn-tools">工具 ▾</button>
  <button class="tbtn" id="btn-close" title="关闭">✕</button>
</div>
<div class="tool-menu" id="tool-menu">
  <div class="group">功能页</div>
  <button data-page="liquify">液化</button><button data-page="blur">模糊</button>
  <button data-page="filter">滤镜</button><button data-page="adjust">调整</button>
  <hr><div class="group">工具箱</div>
  <button data-tool="history">历史记录</button><button data-tool="stats">统计</button>
  <button data-tool="lab">Lab 取色器</button><button data-tool="triad">三角色盘</button>
  <button data-tool="actions">动作</button><button data-tool="appearance">外观与快捷键</button>
  <button data-tool="gradient">渐变换色</button>
  <button data-tool="gray">黑白监看（本窗口）</button>
  <hr><div class="group">需原生组件的工具</div>
  <button data-tool="brush">笔刷导入…</button><button data-tool="stamp">画布盖印…</button>
  <button data-tool="eraser">穿透橡皮（选中图层）</button><button data-tool="overlay">SAI2 画布黑白覆盖</button>
  <button data-tool="timelapse">缩时摄影</button>
</div>
<div class="workspace">
  <nav class="side" id="side">
    <button class="tool" data-page="liquify" title="液化"><svg viewBox="0 0 16 16"><path d="M8 1.5S3.5 7 3.5 10.2a4.5 4.5 0 0 0 9 0C12.5 7 8 1.5 8 1.5z"/></svg><span>液</span></button>
    <button class="tool" data-page="blur" title="模糊"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3.4"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/></svg><span>模</span></button>
    <button class="tool" data-page="adjust" title="调整"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor" stroke="none"/></svg><span>调</span></button>
    <button class="tool" data-page="filter" title="滤镜"><svg viewBox="0 0 16 16"><path d="M8 2 2.5 5 8 8l5.5-3L8 2z"/><path d="m2.5 8.5 5.5 3 5.5-3"/><path d="m2.5 12 5.5 3 5.5-3"/></svg><span>滤</span></button>
    <button class="tool" data-page="selection" title="选区"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1" stroke-dasharray="3 2"/></svg><span>选</span></button>
    <button class="tool" data-page="tools" title="工具箱"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.2v2.1M8 12.7v2.1M1.2 8h2.1M12.7 8h2.1M3.2 3.2l1.5 1.5M11.3 11.3l1.5 1.5M12.8 3.2l-1.5 1.5M4.7 11.3l-1.5 1.5"/></svg><span>工</span></button>
    <div class="sep"></div>
    <button class="tool" data-page="about" title="关于"><span style="font-size:13px;font-weight:500">?</span></button>
    <div class="foot">原创界面<br>原创引擎</div>
  </nav>
  <div class="canvas-col">
    <div class="solo-hint" id="solo-hint" hidden>
      <span>侧栏页只展示界面，抓图 / 预览 / 应用请在浮窗里操作。</span>
      <button id="solo-open">打开浮窗</button>
    </div>
    <div class="canvas-area" id="canvas-area">
      <canvas id="preview" style="display:none"></canvas>
      <canvas id="overlay" style="display:none"></canvas>
      <div class="empty" id="empty">尚未抓取图层<br>先在 SAI2 打开一幅画，再点「抓取当前图层」</div>
      <div class="float-panel" id="layer-panel">
        <div class="fp-hd"><span>SAI2 图层</span><button id="btn-layer-toggle" title="折叠 / 展开">⌄</button></div>
        <div class="fp-bd">
          <div class="fp-actions">
            <button id="btn-refresh">刷新</button>
            <button id="btn-inject">连接注入</button>
            <button id="btn-whitelist">加白名单</button>
            <button id="btn-grab" class="grab">抓取当前图层</button>
          </div>
          <div id="layer-list"></div>
        </div>
      </div>
      <div class="quality-pill">
        <span id="status-image">尚未抓取图层</span><span class="sep"></span>
        <span id="status-agent">未连接注入器</span><span class="sep"></span>
        <span class="rgb">RGB</span><span>缩放</span>
        <input type="range" id="zoom" min="25" max="400" step="5" value="100">
        <span id="zoom-label">100%</span><button class="mini" id="btn-fit">适配</button>
      </div>
    </div>
  </div>
  <aside class="inspector" id="params"></aside>
</div>
<div class="bottombar" id="bottombar">
  <button class="btn-secondary" id="btn-preview">预览</button>
  <button class="btn-primary" id="btn-apply">应用并贴回</button>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
'use strict'
var bridge = window.pluginBridge
// 侧栏单工具页由 index.js 的 panelHtml() 在 <head> 后注入：
//   window.__FX_INITIAL_PAGE = 'blur' 等页签名；window.__FX_SOLO = 1 表示隐藏左侧导航
var INITIAL_PAGE = typeof window.__FX_INITIAL_PAGE === 'string' && window.__FX_INITIAL_PAGE
  ? window.__FX_INITIAL_PAGE : 'liquify'
var SOLO = window.__FX_SOLO === 1
var state = {
  page: INITIAL_PAGE, effect: '', params: {}, layers: [], sel: -1, hasImage: false, agentOk: false,
  zoom: 100, imageUrl: null, imgW: 0, imgH: 0, gray: false, autoPaste: true,
  filterThumbs: {}, filterGroup: '全部', selectionTool: 'rect', selectionActive: false,
  history: [], stats: { ops: 0, strokes: 0, undos: 0 }, actions: [], recording: false,
  lab: { L: 60, a: 0, b: 0, hex: '' }, triadH: 210, triadS: 0.7, triadV: 0.9,
  gradientStops: [{pos:0,color:[0,0,0]},{pos:1,color:[255,255,255]}], curvePoints: null,
  accent: '#ff9a3c', fontScale: 1, hotkeys: 'Ctrl+Alt', reqId: 0, pending: {},
  tab: 'param', cardOpen: { basic: true, advanced: false, preset: false, history: false }, layerOpen: true
}
function send(type, extra) {
  if (!bridge) return toast(SOLO ? '侧栏页只做展示，请在浮窗里操作' : '浮窗通信未就绪')
  var msg = { type: type }
  if (extra) for (var k in extra) msg[k] = extra[k]
  bridge.send(msg)
}
function request(type, extra, cb) {
  var id = 'r' + (++state.reqId)
  state.pending[id] = cb
  send(type, Object.assign({ requestId: id }, extra || {}))
}
function toast(text) {
  var t = document.getElementById('toast')
  t.textContent = text; t.classList.add('show')
  clearTimeout(t._timer); t._timer = setTimeout(function () { t.classList.remove('show') }, 2000)
}

// ---- 顶栏 / 卡片呈现辅助（只改呈现，不动消息与算法） ----
function updateTop() {
  var d = document.getElementById('agent-dot')
  if (d) d.classList.toggle('on', !!state.agentOk)
  var n = document.getElementById('tool-name')
  if (!n) return
  var def = DEFS[state.page]
  n.textContent = state.page === 'tools' ? '工具箱' : state.page === 'about' ? '关于'
    : state.page === 'selection' ? '选区' : (def && def.title) || '特效工坊'
}
function setBottom(show) {
  var bar = document.getElementById('bottombar')
  if (bar) bar.hidden = !show
}
function applyCards() {
  var cards = document.querySelectorAll('#params .card'), any = false
  cards.forEach(function (c) {
    var show = c.dataset.tab === state.tab
    if (show) any = true
    c.hidden = !show
    c.classList.toggle('collapsed', !state.cardOpen[c.dataset.card])
  })
  if (!any) cards.forEach(function (c) { c.hidden = c.dataset.card !== 'basic' })
}
function applyTab(tab) {
  state.tab = tab
  document.querySelectorAll('#seg-tabs button').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === tab)
  })
  applyCards()
}
function cardHTML(key, tab, title, body, open) {
  return '<section class="card' + (open ? '' : ' collapsed') + '" data-card="' + key + '" data-tab="' + tab + '">' +
    '<header class="card-hd"><span>' + title + '</span><span class="chev">⌄</span></header>' +
    '<div class="card-bd">' + body + '</div></section>'
}
function filterChips() {
  return '<div class="chipset" id="filter-group">' + FILTER_GROUPS.map(function (g) {
    return '<button type="button" class="chip' + (g === state.filterGroup ? ' active' : '') + '" data-group="' + g + '">' + g + '</button>'
  }).join('') + '</div>'
}

// ---- 效果定义（effect id 与引擎一致） ----

}

    mk('gaussian','高斯模糊',[['radius','半径',0,60,6],['sigma','Sigma',0.5,12,2]]),
    mk('box','方框模糊',[['radius','半径',0,60,8]]),

var FILTER_GROUPS = ['全部','艺术','模糊','画笔','扭曲','风格化','纹理','颜色','手写']
function paramsFor(def) { var o={}; def.params.forEach(function(p){o[p[0]]=p[5]}); return o }
function currentDef() { return DEFS[state.page] }
function currentEffect() {
  var d=currentDef(); if(!d)return null
  return d.effects.find(function(e){return e.id===state.effect}) || d.effects[0]
}

  if (state.page==='about') {
    box.innerHTML=cardHTML('basic','param','关于',
      '<div class="note">UI 层与核心引擎为原创重写：JS 图像模型、降采样预览、' +
      '选区掩码、历史/动作、Lab/HSV 色彩工具、液化位移场均由本项目实现；算法逻辑移植自 MIT 项目 ' +
      'PainterAnkry/sai2-plugin-suite。随包上游注入套件原样分发、未修改。<br><br>' +
      '非官方作品，与上游作者无背书关系。使用注入类工具请备份画作。</div>', true)
    setBottom(false); applyCards(); updateTop(); return
  }
  if (state.page==='selection') return renderSelectionPanel(box)
  var def=currentDef(); if(!def)return
  if (def.effects.length && !def.effects.some(function(e){return e.id===state.effect})) {
    state.effect=def.effects[0].id; state.params=paramsFor(def.effects[0])
  }
  if (!def.effects.length && !state.effect) state.params={}
  var eff=currentEffect() || { id: state.effect, name: state.effect, params: [] }

  var basicBody='<h3>'+def.title+'</h3>'
  if (state.page==='filter') {
    basicBody+='<div class="note">在「预设」卡片按分组筛选滤镜，点缩略图选择效果。</div>'
  } else {
    basicBody+='<div class="grid" id="effect-grid">'+def.effects.map(function(e){
      return '<button data-effect="'+e.id+'"'+(e.id===state.effect?' class="active"':'')+'>'+e.name+'</button>'
    }).join('')+'</div>'
  }

  var advBody='<h4>参数</h4><div id="param-rows"></div>'
  if (state.effect==='curves') advBody+='<canvas id="curve" class="editor" width="220" height="150"></canvas>' +
    '<div class="note">拖动控制点；点空白处加一个点，右键删除。</div>'
  if (state.effect==='gradientMap') advBody+='<canvas id="gradient" class="editor" width="220" height="40"></canvas>' +
    '<div class="row"><label>色标颜色</label><input type="color" id="stop-color" value="#ffffff"></div>' +
    '<div class="note">点渐变条加色标；拖动改位置；双击用上方颜色改色。</div>'
  advBody+='<div class="actions sub"><button id="btn-apply-clip" disabled>应用 → 剪贴板</button>' +
    '<button id="btn-undo">撤销</button><button id="btn-redo">重做</button><button id="btn-reset">复位</button></div>' +
    '<div class="row checkbox" style="margin-top:10px"><label><input type="checkbox" id="auto-paste"' +
    (state.autoPaste?' checked':'')+'> 应用后自动贴回</label></div>'

  var presetBody=filterChips() + (state.page==='filter'
    ? '<div class="grid thumb" id="filter-grid"></div>'
    : '<div class="note">滤镜页可在此按分组浏览 53 个缩略图预设。</div>')

  var historyBody='<h4>历史记录</h4><div class="list" id="history-list"></div>' +
    '<h4>统计</h4><div id="stats-box" class="note"></div>' +
    '<h4>动作</h4><div class="list" id="action-list"></div>'

  box.innerHTML=cardHTML('basic','param','基础',basicBody,true)

    + cardHTML('history','history','历史',historyBody,false)
  setBottom(true)
  bindParams(eff)
  renderHistory(); renderStats(); renderActions()
  syncApply()
  if (state.page==='filter') renderFilterGrid()
  if (state.effect==='curves') setupCurve()
  if (state.effect==='gradientMap') setupGradient()
  applyCards(); updateTop()
}
/** 抓到图才能「应用并贴回」；页面切换也要按当前状态重算，别留旧禁用态 */
function syncApply(){
  var b=document.getElementById('btn-apply')
  if(b)b.disabled=!state.hasImage
}
function renderParamRows(eff) {
  var host=document.getElementById('param-rows'); if(!host)return
  host.innerHTML=eff.params.map(function(p){
    var val=state.params[p[0]]==null?p[5]:state.params[p[0]]
    var step=Math.abs(p[4])<1?0.05:1
    return '<div class="row"><label><span>'+p[1]+'</span><span id="v-'+p[0]+'">'+val+'</span></label>' +
      '<div class="slider-line"><input type="range" data-key="'+p[0]+'" min="'+p[3]+'" max="'+p[4]+'" step="'+step+'" value="'+val+'">' +
      '<input type="number" data-num="'+p[0]+'" min="'+p[3]+'" max="'+p[4]+'" step="'+step+'" value="'+val+'"></div></div>'
  }).join('')
  host.querySelectorAll('.slider-line').forEach(function(line){
    var range=line.querySelector('input[type=range]'), num=line.querySelector('input[type=number]')
    var key=range.dataset.key, label=document.getElementById('v-'+key)
    function setVal(v){
      v=Number(v); if(!isFinite(v))return
      state.params[key]=v; range.value=v; num.value=v
      if(label)label.textContent=v
      send('param',{page:state.page,effect:state.effect,key:key,value:v})
    }
    range.oninput=function(){setVal(this.value)}
    range.onchange=function(){doPreview()}
    num.oninput=function(){setVal(this.value)}
    num.onchange=function(){doPreview()}
  })
}
function bindParams(eff) {
  document.querySelectorAll('#effect-grid button').forEach(function(b){
    b.onclick=function(){
      state.effect=b.dataset.effect
      var e=currentDef().effects.find(function(x){return x.id===state.effect})
      state.params=paramsFor(e)
      if(state.effect==='curves')state.curvePoints=null
      if(state.effect==='gradientMap')state.gradientStops=[{pos:0,color:[0,0,0]},{pos:1,color:[255,255,255]}]
      renderParams()
    }
  })
  var fg=document.getElementById('filter-group')
  if (fg) fg.querySelectorAll('[data-group]').forEach(function(c){
    c.onclick=function(){
      state.filterGroup=c.dataset.group
      fg.querySelectorAll('[data-group]').forEach(function(x){x.classList.toggle('active',x===c)})
      renderFilterGrid()
    }
  })
  renderParamRows(eff)
  document.getElementById('btn-preview').onclick=doPreview
  document.getElementById('btn-apply-clip').onclick=function(){doApply(false)}
  document.getElementById('btn-apply').onclick=function(){doApply(true)}
  document.getElementById('btn-undo').onclick=function(){send('undo')}
  document.getElementById('btn-redo').onclick=function(){send('redo')}
  document.getElementById('btn-reset').onclick=function(){send('reset')}
  document.getElementById('auto-paste').onchange=function(){state.autoPaste=!!this.checked}
}
function effectPayload() {
  var p=Object.assign({},state.params)
  if(state.effect==='curves'&&state.curvePoints)p.points=state.curvePoints
  if(state.effect==='gradientMap')p.stops=state.gradientStops
  if(state.selectionActive)p.mask=true
  return {page:state.page,effect:state.effect,params:p,tool:state.effect}
}
function doPreview(){send('preview',effectPayload())}
function doApply(paste){send('apply',Object.assign(effectPayload(),{paste:paste}))}
function renderFilterGrid() {
  var grid=document.getElementById('filter-grid'); if(!grid)return
  var ids=Object.keys(state.filterThumbs).filter(function(id){
    var f=state.filterThumbs[id]
    return state.filterGroup==='全部'||(f&&f.group===state.filterGroup)
  })
  grid.innerHTML=ids.map(function(id){
    var f=state.filterThumbs[id]
    return '<button data-effect="'+id+'"'+(id===state.effect?' class="active"':'')+' title="'+f.name+'">' +
      (f.dataUrl?'<img src="'+f.dataUrl+'">':'')+'<span>'+f.name+'</span></button>'
  }).join('')
  grid.querySelectorAll('button[data-effect]').forEach(function(b){
    b.onclick=function(){
      state.effect=b.dataset.effect
      state.params=Object.assign({},state.filterThumbs[state.effect].defaultParams||{})
      renderParams()
    }
  })
}

// ---- 曲线 / 渐变编辑器 ----
function setupCurve() {
  var c=document.getElementById('curve'); if(!c)return
  if(!state.curvePoints)state.curvePoints=[
    {x:0,y:0},{x:0.25,y:0.22},{x:0.5,y:0.5},{x:0.75,y:0.78},{x:1,y:1}]
  var ctx=c.getContext('2d'), drag=-1
  function xy(p){return [p.x*c.width,(1-p.y)*c.height]}
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1
    for(var i=0;i<=4;i++){var x=i/4*c.width,y=i/4*c.height
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
    ctx.strokeStyle='#ff9a3c';ctx.lineWidth=2;ctx.beginPath()
    state.curvePoints.forEach(function(p,i){var q=xy(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])})
    ctx.stroke();ctx.fillStyle='#fff'
    state.curvePoints.forEach(function(p){var q=xy(p);ctx.beginPath();ctx.arc(q[0],q[1],4,0,7);ctx.fill()})
  }
  function pos(e){var r=c.getBoundingClientRect()
    return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))}}
  c.onpointerdown=function(e){
    var p=pos(e),idx=-1
    state.curvePoints.forEach(function(q,i){if(Math.abs(q.x-p.x)<.05&&Math.abs(q.y-p.y)<.06)idx=i})
    if(idx>=0)drag=idx
    else if(e.button===0){state.curvePoints.push(p);state.curvePoints.sort(function(a,b){return a.x-b.x});draw();doPreview()}
  }
  c.onpointermove=function(e){
    if(drag<0)return
    var p=pos(e)
    if(drag===0||drag===state.curvePoints.length-1)p.x=state.curvePoints[drag].x
    state.curvePoints[drag]=p;draw();doPreview()
  }
  c.onpointerup=function(){drag=-1}
  c.oncontextmenu=function(e){
    e.preventDefault();var p=pos(e),idx=-1
    state.curvePoints.forEach(function(q,i){if(Math.abs(q.x-p.x)<.05&&Math.abs(q.y-p.y)<.06)idx=i})
    if(idx>0&&idx<state.curvePoints.length-1){state.curvePoints.splice(idx,1);draw();doPreview()}
  }
  draw()
}
function setupGradient() {
  var c=document.getElementById('gradient'); if(!c)return
  var ctx=c.getContext('2d'),drag=-1
  function draw(){
    var g=ctx.createLinearGradient(0,0,c.width,0)
    state.gradientStops.slice().sort(function(a,b){return a.pos-b.pos}).forEach(function(s){
      g.addColorStop(s.pos,'rgb('+s.color.join(',')+')')})
    ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height-10);ctx.fillStyle='#fff'
    state.gradientStops.forEach(function(s){ctx.fillRect(s.pos*c.width-3,c.height-10,6,6)})
  }
  function pos(e){var r=c.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}
  c.onpointerdown=function(e){
    var p=pos(e),hit=-1
    state.gradientStops.forEach(function(s,i){if(Math.abs(s.pos-p)<.03)hit=i})
    if(hit>=0)drag=hit
    else{document.getElementById('stop-color').value='#ffffff';state.gradientStops.push({pos:p,color:[255,255,255]});drag=state.gradientStops.length-1}
    draw();doPreview()
  }
  c.onpointermove=function(e){if(drag<0)return;state.gradientStops[drag].pos=pos(e);draw();doPreview()}
  c.onpointerup=function(){drag=-1}
  c.ondblclick=function(e){
    var p=pos(e),hit=-1
    state.gradientStops.forEach(function(s,i){if(Math.abs(s.pos-p)<.03)hit=i})
    if(hit>=0){var v=document.getElementById('stop-color').value
      state.gradientStops[hit].color=[parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)]
      draw();doPreview()}
  }
  document.getElementById('stop-color').onchange=function(){
    var v=this.value,last=state.gradientStops[state.gradientStops.length-1]
    last.color=[parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)]
    draw();doPreview()
  }
  draw()
}

function renderStats(){
  var el=document.getElementById('stats-box');if(!el)return
  el.textContent='应用 '+state.stats.ops+' 次 · 涂抹 '+state.stats.strokes+' 笔 · 撤销 '+(state.stats.undos||0)+' 次'
}
function renderActions(){
  var el=document.getElementById('action-list');if(!el)return
  el.innerHTML=state.actions.length?state.actions.map(function(a){return '<div>'+a+'</div>'}).join(''):'<div class="note">暂无动作</div>'
}
function hsvToRgb(h,s,v){
  var c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r,g,b
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]
}
function setupLab(){
  var c=document.getElementById('lab-plane');if(!c)return
  var ctx=c.getContext('2d')
  request('colorPlane',{L:state.lab.L,w:c.width,h:c.height},function(r){
    if(r&&r.dataUrl){var im=new Image();im.onload=function(){ctx.drawImage(im,0,0)};im.src=r.dataUrl}
  })
  c.onclick=function(e){
    var r=c.getBoundingClientRect()
    state.lab.a=((e.clientX-r.left)/r.width-0.5)*200
    state.lab.b=((e.clientY-r.top)/r.height-0.5)*200
    request('color',{from:'lab',value:[state.lab.L,state.lab.a,state.lab.b]},function(res){
      if(res&&res.hex){state.lab.hex=res.hex;updateLabInfo();toast('取到 '+res.hex+'，可在 SAI2 取色器输入')}
    })
  }
  updateLabInfo()
}
function updateLabInfo(){
  var el=document.getElementById('lab-info');if(el)
    el.textContent='L '+Math.round(state.lab.L)+' · a '+state.lab.a.toFixed(0)+' · b '+state.lab.b.toFixed(0)+(state.lab.hex?' · '+state.lab.hex:'')
}
function setupTriad(){
  var c=document.getElementById('triad');if(!c)return
  var ctx=c.getContext('2d')
  function css(h,s,v){return 'rgb('+hsvToRgb(h,s,v).join(',')+')'}
  function draw(){
    ctx.clearRect(0,0,c.width,c.height)
    var cx=c.width/2,cy=c.height-12,R=Math.min(c.width/2-8,c.height-24)
    for(var a=0;a<360;a+=2){ctx.strokeStyle='hsl('+a+',100%,50%)';ctx.lineWidth=2
      ctx.beginPath();ctx.arc(cx,cy,R,(a-1)*Math.PI/180,(a+1)*Math.PI/180);ctx.stroke()}
    ctx.fillStyle=css(state.triadH,0,1);ctx.beginPath()
    ctx.moveTo(cx,cy-R);ctx.lineTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.fill()
    var g=ctx.createLinearGradient(cx-R,cy,cx+R,cy)
    g.addColorStop(0,css(state.triadH,1,0));g.addColorStop(1,'rgba(0,0,0,0)')
    ctx.globalCompositeOperation='source-atop';ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height)
    ctx.globalCompositeOperation='source-over'
    var x=cx+(state.triadS-0.5)*R,y=cy-(1-state.triadV)*R
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.stroke()
    var rgb=hsvToRgb(state.triadH,state.triadS,state.triadV)
    document.getElementById('triad-info').textContent='H '+state.triadH+'° S '+state.triadS.toFixed(2)+' V '+state.triadV.toFixed(2)+
      ' · #'+rgb.map(function(n){return n.toString(16).padStart(2,'0')}).join('').toUpperCase()
  }
  c.onclick=function(e){
    var r=c.getBoundingClientRect(),cx=c.width/2,cy=c.height-12,R=Math.min(c.width/2-8,c.height-24)
    var x=(e.clientX-r.left)*(c.width/r.width),y=(e.clientY-r.top)*(c.height/r.height)
    var dx=x-cx,dy=y-cy,ang=Math.atan2(dy,dx)*180/Math.PI+90
    if(Math.hypot(dx,dy)>R*0.9){state.triadH=(ang+360)%360}
    else{state.triadS=Math.max(0,Math.min(1,dx/R+0.5));state.triadV=Math.max(0,Math.min(1,1-dy/R))}
    draw()
  }
  draw()
}

// ---- 画布：预览 / 液化笔画 / 选区 ----
function paint(){
  if(!state.imageUrl)return
  var img=new Image()
  img.onload=function(){
    var pv=document.getElementById('preview'),ov=document.getElementById('overlay'),area=document.getElementById('canvas-area')
    var maxW=Math.max(80,area.clientWidth-24),maxH=Math.max(80,area.clientHeight-24)
    var fit=Math.min(1,maxW/img.width,maxH/img.height),s=fit*state.zoom/100
    pv.width=Math.max(1,Math.round(img.width*s));pv.height=Math.max(1,Math.round(img.height*s))
    pv.getContext('2d').drawImage(img,0,0,pv.width,pv.height)
    pv.style.display='block';document.getElementById('empty').style.display='none'
    pv.style.left=Math.round((area.clientWidth-pv.width)/2)+'px'
    pv.style.top=Math.round((area.clientHeight-pv.height)/2)+'px'
    ov.style.left=pv.style.left;ov.style.top=pv.style.top
  }
  img.src=state.imageUrl
}
function canvasPoint(e){
  var r=document.getElementById('preview').getBoundingClientRect()
  return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}
}
function bindCanvas(){
  var area=document.getElementById('canvas-area'),last=null,dragTool=null,dragPts=null
  area.addEventListener('pointerdown',function(e){
    if(!state.hasImage)return
    var p=canvasPoint(e)
    if(state.page==='liquify'){
      last=p
      send('liquifyStroke',{tool:state.effect,from:p,to:p,radius:Number(state.params.radius||24),amount:Number(state.params.amount||1)})
      state.stats.strokes++;renderStats()
    }else if(state.page==='selection'){
      last=p;dragPts=[p]
      dragTool=e.altKey?'lasso':(e.ctrlKey&&e.shiftKey?'ellipse':(e.shiftKey?'rect':state.selectionTool))
    }
  })
  area.addEventListener('pointermove',function(e){
    if(!last)return
    var p=canvasPoint(e)
    if(state.page==='liquify'){
      send('liquifyStroke',{tool:state.effect,from:last,to:p,radius:Number(state.params.radius||24),amount:Number(state.params.amount||1)})
      last=p
    }else if(state.page==='selection'&&dragPts)dragPts.push(p)
  })
  window.addEventListener('pointerup',function(e){
    if(!last)return
    if(state.page==='selection'&&dragPts){
      var p=canvasPoint(e)
      if(dragTool==='magicWand'||dragTool==='pen')send('selection',{op:dragTool,points:dragPts})
      else send('selection',{op:dragTool,from:dragPts[0],to:p,points:dragPts})
      state.selectionActive=true
    }
    last=null;dragPts=null;dragTool=null
  })
}

// ---- 图层 / 事件 ----
function renderLayers(){
  var box=document.getElementById('layer-list')
  if(!state.layers.length){box.innerHTML='<div class="note">'+(state.agentOk?'未识别到图层，先在 SAI2 点一下图层面板':'未连接注入器，点「连接注入」')+'</div>';return}
  box.innerHTML=''
  state.layers.forEach(function(r,i){
    var d=document.createElement('div');d.className='layer-row'+(i===state.sel?' sel':'')
    d.textContent='#'+(i+1)+'  '+r.text
    d.onclick=function(){state.sel=i;renderLayers();send('selectLayer',{index:i,row:r})}
    box.appendChild(d)
  })
}
document.getElementById('side').querySelectorAll('button[data-page]').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#side button').forEach(function(x){x.classList.remove('active')})
    b.classList.add('active');state.page=b.dataset.page
    if(DEFS[state.page]&&!DEFS[state.page].effects.length)state.effect=''
    renderParams()
  }
})
document.getElementById('btn-close').onclick=function(){send('close')}
document.getElementById('btn-refresh').onclick=function(){send('refreshLayers')}
document.getElementById('btn-inject').onclick=function(){toast('正在连接注入器…');send('inject')}
document.getElementById('btn-whitelist').onclick=function(){toast('请在 UAC 弹窗中确认');send('whitelist')}
document.getElementById('btn-grab').onclick=function(){send('grab')}
var toolMenu=document.getElementById('tool-menu')
document.getElementById('btn-tools').onclick=function(e){e.stopPropagation();toolMenu.classList.toggle('show')}
document.addEventListener('click',function(e){if(!toolMenu.contains(e.target)&&e.target.id!=='btn-tools')toolMenu.classList.remove('show')})
toolMenu.querySelectorAll('button[data-page]').forEach(function(b){b.onclick=function(){
  toolMenu.classList.remove('show')
  document.querySelector('#side button[data-page="'+b.dataset.page+'"]').click()
}})
toolMenu.querySelectorAll('button[data-tool]').forEach(function(b){b.onclick=function(){
  toolMenu.classList.remove('show');var t=b.dataset.tool
  if(t==='gray'){state.gray=!state.gray;document.getElementById('canvas-area').classList.toggle('gray',state.gray);toast(state.gray?'已切黑白预览':'已恢复彩色');return}
  if(t==='gradient'){
    document.querySelector('#side button[data-page="adjust"]').click()
    state.effect='gradientMap'; state.params={}; renderParams(); return
  }
  if(['history','stats','lab','triad','actions','appearance'].indexOf(t)>=0){
    document.querySelector('#side button[data-page="tools"]').click()
    if(t==='history')applyTab('history')
    setTimeout(function(){var el=document.getElementById(t==='history'?'history-list':t==='stats'?'stats-box':t)
      if(el)el.scrollIntoView({block:'center'})},30)
    return
  }
  send('openSuitePanel',{tool:t});toast('正在打开原生工具：'+b.textContent)
}})
var zoomEl=document.getElementById('zoom')
zoomEl.oninput=function(){state.zoom=Number(this.value);document.getElementById('zoom-label').textContent=state.zoom+'%';paint()}
document.getElementById('btn-fit').onclick=function(){state.zoom=100;zoomEl.value='100';document.getElementById('zoom-label').textContent='100%';paint()}
// 顶栏分段：参数 / 预设 / 历史
document.querySelectorAll('#seg-tabs button').forEach(function(b){b.onclick=function(){applyTab(b.dataset.tab)}})
// 卡片头折叠（状态存 state.cardOpen）
document.getElementById('params').addEventListener('click',function(e){
  var hd=e.target.closest('.card-hd'); if(!hd)return
  var card=hd.closest('.card'); if(!card)return
  var key=card.dataset.card
  state.cardOpen[key]=!state.cardOpen[key]
  card.classList.toggle('collapsed',!state.cardOpen[key])
})
// 图层浮动面板折叠
document.getElementById('btn-layer-toggle').onclick=function(){
  state.layerOpen=!state.layerOpen
  document.getElementById('layer-panel').classList.toggle('collapsed',!state.layerOpen)
  this.textContent=state.layerOpen?'⌄':'›'
}
bindCanvas()

if (bridge) bridge.onMessage(function(msg){
  if(!msg||!msg.type)return
  if(msg.requestId&&state.pending[msg.requestId]){var cb=state.pending[msg.requestId];delete state.pending[msg.requestId];cb(msg);return}
  switch(msg.type){
    case 'layers': state.layers=msg.layers||[];state.agentOk=!!msg.ok
      document.getElementById('status-agent').textContent=msg.ok?'注入器已连接':'未连接注入器';renderLayers();updateTop();break
    case 'image': state.imageUrl=msg.dataUrl;state.hasImage=!!msg.dataUrl;paint();syncApply();break
    case 'grabbed': document.getElementById('status-image').textContent='已抓取图层 '+msg.width+' x '+msg.height;break
    case 'status': toast(msg.text||'');break
    case 'history': state.history=msg.list||[];renderHistory();break
    case 'stats': state.stats=msg.stats||state.stats;renderStats();break
    case 'actions': state.actions=msg.list||[];renderActions();break
    case 'filterList': state.filterThumbs={};msg.list.forEach(function(f){state.filterThumbs[f.id]=f})
      msg.list.forEach(function(f){send('thumb',{id:f.id})})
      if(state.page==='filter')renderParams();break
    case 'thumb': if(state.filterThumbs[msg.id])state.filterThumbs[msg.id].dataUrl=msg.dataUrl
      if(state.page==='filter')renderFilterGrid();break
    case 'mask': var ov=document.getElementById('overlay')
      if(msg.dataUrl&&state.imageUrl){var im=new Image();im.onload=function(){
        ov.width=document.getElementById('preview').width;ov.height=document.getElementById('preview').height
        ov.getContext('2d').clearRect(0,0,ov.width,ov.height);ov.getContext('2d').drawImage(im,0,0,ov.width,ov.height)
        ov.style.display='block'};im.src=msg.dataUrl}
      else ov.style.display='none'
      break
    case 'cleared': state.imageUrl=null;state.hasImage=false;document.getElementById('preview').style.display='none'
      document.getElementById('empty').style.display='block';syncApply();break
  }
})

// 单工具页：隐藏导航，把高亮落到注入的页签上
if (SOLO) {
  document.getElementById('side').hidden = true
  if (!bridge) {
    // 侧栏页跑在沙箱 iframe 里，拿不到 pluginBridge，只做界面展示
    var soloHint = document.getElementById('solo-hint')
    if (soloHint) soloHint.hidden = false
    var soloOpen = document.getElementById('solo-open')
    if (soloOpen) soloOpen.onclick = function () {
      window.parent.postMessage({ __sai2Page: 'action', id: 'fx-open-panel' }, '*')
    }
  }
}
document.querySelectorAll('#side button[data-page]').forEach(function (b) {
  b.classList.toggle('active', b.dataset.page === state.page)
})

if (bridge) send('filterList')
renderParams()
})()
</script>
