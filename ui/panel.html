<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SAI2 特效工坊</title>
<style>
:root {
  --bg: rgba(28,30,38,.78); --panel: rgba(48,51,62,.72); --panel2: rgba(64,68,80,.58);
  --line: rgba(255,255,255,.12); --text: #eef0f6; --dim: #a8adbd;
  --accent: var(--fx-accent, #7aa2ff); --radius: 12px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.5 "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden;
  backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
  font-size: calc(13px * var(--font-scale, 1));
}
button, input, select { font: inherit; }
button { cursor: pointer; }
.titlebar {
  height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  -webkit-app-region: drag; user-select: none;
}
.titlebar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.titlebar .spacer { flex: 1; }
.titlebar button {
  -webkit-app-region: no-drag; border: 1px solid var(--line); background: var(--panel2);
  color: var(--text); border-radius: 6px; padding: 3px 9px; font-size: 12px;
}
.titlebar button:hover { border-color: var(--accent); }
.app { display: flex; height: calc(100% - 38px); }
.side {
  width: 92px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
  padding: 8px 6px; display: flex; flex-direction: column; gap: 3px;
}
.side button {
  border: 0; background: transparent; color: var(--dim); text-align: left;
  padding: 8px 10px; border-radius: 8px; font-size: 12px;
}
.side button.active { background: var(--panel2); color: var(--text); box-shadow: inset 2px 0 var(--accent); }
.side[hidden] { display: none; }
.side .foot { margin-top: auto; font-size: 10px; color: var(--dim); padding: 6px; line-height: 1.5; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.canvas-area {
  flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: crosshair;
  display: flex; align-items: center; justify-content: center;
  background:
    linear-gradient(45deg, rgba(255,255,255,.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.04) 75%),
    linear-gradient(45deg, rgba(255,255,255,.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.04) 75%);
  background-size: 18px 18px; background-position: 0 0, 9px 9px;
}
.canvas-area canvas { position: absolute; transform-origin: 0 0; }
.canvas-area #preview { box-shadow: 0 4px 18px rgba(0,0,0,.4); border-radius: 4px; }
.canvas-area #overlay { pointer-events: none; opacity: .6; }
.canvas-area.gray #preview { filter: grayscale(1); }
.empty { color: var(--dim); text-align: center; line-height: 2; }
.layers { height: 104px; flex: none; border-top: 1px solid var(--line); padding: 6px 10px; overflow: auto; }
.layers .hd { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 11px; color: var(--dim); }
.layers .hd button, .mini {
  border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  border-radius: 5px; padding: 2px 8px; font-size: 11px;
}
.layer-row { padding: 3px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer-row:hover { background: var(--panel2); }
.layer-row.sel { background: var(--accent); color: #fff; }
.statusbar {
  height: 30px; flex: none; display: flex; align-items: center; gap: 8px;
  padding: 0 10px; border-top: 1px solid var(--line); background: var(--panel); color: var(--dim); font-size: 11px;
}
.statusbar .sep { flex: 1; }
.statusbar input[type=range] { width: 100px; accent-color: var(--accent); }
.params { width: 286px; flex: none; border-left: 1px solid var(--line); background: var(--panel); padding: 10px; overflow: auto; }
.params h3 { margin: 0 0 8px; font-size: 13px; }
.params h4 { margin: 14px 0 6px; font-size: 11px; color: var(--dim); font-weight: 500; }
.row { margin-bottom: 9px; }
.row > label { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-bottom: 3px; }
.row input[type=range] { width: 100%; accent-color: var(--accent); }
.row select, .row input[type=text], .row input[type=number] {
  width: 100%; background: var(--panel2); color: var(--text);
  border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font-size: 12px;
}
.row.checkbox label { justify-content: flex-start; gap: 6px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.grid button {
  border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  border-radius: 5px; padding: 5px 2px; font-size: 10px; overflow: hidden; text-overflow: ellipsis;
}
.grid button.active { border-color: var(--accent); box-shadow: inset 0 -2px var(--accent); }
.grid.thumb button { padding: 0; height: 54px; font-size: 9px; position: relative; display: flex; align-items: flex-end; justify-content: center; }
.grid.thumb button img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
.grid.thumb button span { position: relative; background: rgba(0,0,0,.6); width: 100%; }
.actions { display: flex; gap: 6px; margin-top: 10px; }
.actions button {
  flex: 1; border: 0; border-radius: 7px; padding: 8px 4px; font-size: 11px;
  background: var(--panel2); color: var(--text);
}
.actions button.primary { background: var(--accent); color: #fff; }
.actions button:disabled { opacity: .4; cursor: not-allowed; }
.tool-menu {
  position: absolute; right: 10px; top: 34px; z-index: 20; min-width: 230px; max-height: 70vh; overflow: auto;
  background: #f7f9fc; color: #20242e; border: 1px solid #d5dae4; border-radius: 8px;
  box-shadow: 0 10px 32px rgba(0,0,0,.35); padding: 6px; font-size: 12px; display: none;
}
.tool-menu.show { display: block; }
.tool-menu .group { padding: 5px 9px 2px; color: #7b8292; font-size: 10px; }
.tool-menu button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  color: #20242e; padding: 5px 9px; border-radius: 5px; font-size: 12px;
}
.tool-menu button:hover { background: #e8edf7; }
.tool-menu hr { border: 0; border-top: 1px solid #e3e7ef; margin: 4px 2px; }
.editor { width: 100%; background: #20242e; border: 1px solid var(--line); border-radius: 5px; touch-action: none; }
.list { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 5px; }
.list div { padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: 11px; cursor: pointer; }
.list div:last-child { border-bottom: 0; }
.list div:hover { background: var(--panel2); }
.toast {
  position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%);
  background: rgba(0,0,0,.78); color: #fff; padding: 7px 14px; border-radius: 20px;
  font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30;
}
.toast.show { opacity: 1; }
.note { color: var(--dim); font-size: 10px; line-height: 1.6; }
.solo-hint {
  flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--panel2); border-bottom: 1px solid var(--line); color: var(--dim); font-size: 11px;
}
.solo-hint[hidden] { display: none; }
.solo-hint button {
  margin-left: auto; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 5px; padding: 2px 9px; font-size: 11px;
}
</style>
</head>
<body>
<div class="titlebar">
  <span class="dot"></span><b>SAI2 特效工坊</b><span class="note">sai2工作台官方插件 · 与 SAI2 官方无关 · 原创 UI / 引擎</span>
  <span class="spacer"></span>
  <button id="btn-tools">工具 ▾</button>
  <button id="btn-close">✕</button>
</div>
<div class="tool-menu" id="tool-menu">
  <div class="group">功能页</div>
  <button data-page="liquify">液化</button><button data-page="blur">模糊</button>
  <button data-page="filter">滤镜</button><button data-page="adjust">调整</button>
  <hr><div class="group">工具箱</div>
  <button data-tool="history">历史记录</button><button data-tool="stats">统计</button>
  <button data-tool="lab">Lab 取色器</button><button data-tool="triad">三角色盘</button>
  <button data-tool="actions">动作</button><button data-tool="appearance">外观与快捷键</button>
  <button data-tool="gradient">渐变换色</button>
  <button data-tool="gray">黑白监看（本窗口）</button>
  <hr><div class="group">需原生组件的工具</div>
  <button data-tool="brush">笔刷导入…</button><button data-tool="stamp">画布盖印…</button>
  <button data-tool="eraser">穿透橡皮（选中图层）</button><button data-tool="overlay">SAI2 画布黑白覆盖</button>
  <button data-tool="timelapse">缩时摄影</button>
</div>
<div class="app">
  <nav class="side" id="side">
    <button data-page="liquify" class="active">液化</button>
    <button data-page="blur">模糊</button>
    <button data-page="filter">滤镜</button>
    <button data-page="adjust">调整</button>
    <button data-page="selection">选区</button>
    <button data-page="tools">工具箱</button>
    <button data-page="about">关于</button>
    <div class="foot">原创 UI / JS 引擎<br>算法移植自 MIT 项目</div>
  </nav>
  <div class="main">
    <div class="solo-hint" id="solo-hint" hidden>
      <span>侧栏页只展示界面，抓图 / 预览 / 应用请在浮窗里操作。</span>
      <button id="solo-open">打开浮窗</button>
    </div>
    <div class="canvas-area" id="canvas-area">
      <canvas id="preview" style="display:none"></canvas>
      <canvas id="overlay" style="display:none"></canvas>
      <div class="empty" id="empty">尚未抓取图层<br>先在 SAI2 打开一幅画，再点「抓取当前图层」</div>
    </div>
    <div class="layers">
      <div class="hd"><span>SAI2 图层</span><button id="btn-refresh">刷新</button>
        <button id="btn-inject">连接注入</button><button id="btn-whitelist">加白名单</button>
        <button id="btn-grab">抓取当前图层</button></div>
      <div id="layer-list"></div>
    </div>
    <div class="statusbar">
      <span id="status-image">尚未抓取图层</span><span id="status-agent">未连接注入器</span>
      <span class="sep"></span><span>缩放</span>
      <input type="range" id="zoom" min="25" max="400" step="5" value="100">
      <span id="zoom-label">100%</span><button class="mini" id="btn-fit">适配</button>
    </div>
  </div>
  <aside class="params" id="params"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
'use strict'
var bridge = window.pluginBridge
// 侧栏单工具页由 index.js 的 panelHtml() 在 <head> 后注入：
//   window.__FX_INITIAL_PAGE = 'blur' 等页签名；window.__FX_SOLO = 1 表示隐藏左侧导航
var INITIAL_PAGE = typeof window.__FX_INITIAL_PAGE === 'string' && window.__FX_INITIAL_PAGE
  ? window.__FX_INITIAL_PAGE : 'liquify'
var SOLO = window.__FX_SOLO === 1
var state = {
  page: INITIAL_PAGE, effect: '', params: {}, layers: [], sel: -1, hasImage: false, agentOk: false,
  zoom: 100, imageUrl: null, imgW: 0, imgH: 0, gray: false, autoPaste: true,
  filterThumbs: {}, filterGroup: '全部', selectionTool: 'rect', selectionActive: false,
  history: [], stats: { ops: 0, strokes: 0, undos: 0 }, actions: [], recording: false,
  lab: { L: 60, a: 0, b: 0, hex: '' }, triadH: 210, triadS: 0.7, triadV: 0.9,
  gradientStops: [{pos:0,color:[0,0,0]},{pos:1,color:[255,255,255]}], curvePoints: null,
  accent: '#7aa2ff', fontScale: 1, hotkeys: 'Ctrl+Alt', reqId: 0, pending: {}
}
function send(type, extra) {
  if (!bridge) return toast(SOLO ? '侧栏页只做展示，请在浮窗里操作' : '浮窗通信未就绪')
  var msg = { type: type }
  if (extra) for (var k in extra) msg[k] = extra[k]
  bridge.send(msg)
}
function request(type, extra, cb) {
  var id = 'r' + (++state.reqId)
  state.pending[id] = cb
  send(type, Object.assign({ requestId: id }, extra || {}))
}
function toast(text) {
  var t = document.getElementById('toast')
  t.textContent = text; t.classList.add('show')
  clearTimeout(t._timer); t._timer = setTimeout(function () { t.classList.remove('show') }, 2000)
}

// ---- 效果定义（effect id 与引擎一致） ----
var LIQUIFY_TOOLS = [
  ['forward','向前变形'],['reconstruct','重建'],['smooth','平滑'],['clockwise','顺时针'],
  ['counterclockwise','逆时针'],['pinch','褶皱'],['inflate','膨胀'],['pushLeft','左推']
]
function mk(id, name, params) {
  return { id:id, name:name, params:params.map(function(p){return [p[0],p[1],'range',p[2],p[3],p[4]]}) }
}
var DEFS = {
  liquify: { title:'液化', effects: LIQUIFY_TOOLS.map(function(t){
    return mk(t[0],t[1],[['radius','笔刷半径',2,120,24],['amount','强度',-3,3,1]])
  }) },
  blur: { title:'模糊', effects: [
    mk('gaussian','高斯模糊',[['radius','半径',0,60,6],['sigma','Sigma',0.5,12,2]]),
    mk('box','方框模糊',[['radius','半径',0,60,8]]),
    mk('motion','动感模糊',[['distance','距离',0,60,10],['angle','角度',0,360,0]]),
    mk('radial','径向模糊',[['strength','强度',0,1,0.4]]),
    mk('surface','表面模糊',[['radius','半径',0,40,8],['amount','阈值',0,60,16]]),
    mk('special','特殊模糊',[['radius','半径',0,40,6],['amount','阈值',0,60,12]]),
    mk('lens','镜头模糊',[['radius','半径',0,40,8],['bright','阈值',0,60,12]]),
    mk('average','平均模糊',[['radius','半径',1,80,16]]),
    mk('perspective','透视模糊',[['strength','强度',0,1,0.4]])
  ] },
  filter: { title:'滤镜', effects: [] },
  adjust: { title:'调整', effects: [
    mk('invert','反相',[]),mk('grayscale','去色',[]),mk('threshold','阈值',[['threshold','阈值',0,255,128]]),
    mk('posterize','色调分离',[['levels','级数',2,16,5]]),
    mk('brightnessContrast','亮度对比度',[['brightness','亮度',-100,100,0],['contrast','对比度',-100,100,0]]),
    mk('levels','色阶',[['black','黑场',0,255,0],['white','白场',0,255,255],['gamma','Gamma',0.1,3,1]]),
    mk('hueSaturation','色相饱和度',[['hue','色相',-180,180,0],['saturation','饱和度',0,2,1],['lightness','明度',0,2,1]]),
    mk('colorBalance','色彩平衡',[['cyanRed','青↔红',-100,100,0],['magentaGreen','洋红↔绿',-100,100,0],['yellowBlue','黄↔蓝',-100,100,0]]),
    mk('gradientMap','渐变映射',[]),mk('curves','曲线',[])
  ] }
}
var FILTER_GROUPS = ['全部','艺术','模糊','画笔','扭曲','风格化','纹理','颜色','手写']
function paramsFor(def) { var o={}; def.params.forEach(function(p){o[p[0]]=p[5]}); return o }
function currentDef() { return DEFS[state.page] }
function currentEffect() {
  var d=currentDef(); if(!d)return null
  return d.effects.find(function(e){return e.id===state.effect}) || d.effects[0]
}

// ---- 参数面板 ----
function renderParams() {
  var box=document.getElementById('params')
  if (state.page==='tools') return renderTools(box)
  if (state.page==='about') {
    box.innerHTML='<h3>关于</h3><div class="note">UI 层与核心引擎为原创重写：JS 图像模型、降采样预览、' +
      '选区掩码、历史/动作、Lab/HSV 色彩工具、液化位移场均由本项目实现；算法逻辑移植自 MIT 项目 ' +
      'PainterAnkry/sai2-plugin-suite。随包上游注入套件原样分发、未修改。<br><br>' +
      '非官方作品，与上游作者无背书关系。使用注入类工具请备份画作。</div>'
    return
  }
  if (state.page==='selection') return renderSelectionPanel(box)
  var def=currentDef(); if(!def)return
  if (def.effects.length && !def.effects.some(function(e){return e.id===state.effect})) {
    state.effect=def.effects[0].id; state.params=paramsFor(def.effects[0])
  }
  if (!def.effects.length && !state.effect) state.params={}
  var eff=currentEffect() || { id: state.effect, name: state.effect, params: [] }
  var html='<h3>'+def.title+'</h3>'
  if (state.page==='filter') {
    html+='<div class="row"><label>分组</label><select id="filter-group">' +
      FILTER_GROUPS.map(function(g){return '<option'+(g===state.filterGroup?' selected':'')+'>'+g+'</option>'}).join('') +
      '</select></div><div class="grid thumb" id="filter-grid"></div>'
  } else {
    html+='<div class="grid" id="effect-grid">'+def.effects.map(function(e){
      return '<button data-effect="'+e.id+'"'+(e.id===state.effect?' class="active"':'')+'>'+e.name+'</button>'
    }).join('')+'</div>'
  }
  html+='<h4>参数</h4><div id="param-rows"></div>'
  if (state.effect==='curves') html+='<canvas id="curve" class="editor" width="262" height="180"></canvas>' +
    '<div class="note">拖动控制点；点空白处加一个点，右键删除。</div>'
  if (state.effect==='gradientMap') html+='<canvas id="gradient" class="editor" width="262" height="40"></canvas>' +
    '<div class="row"><label>色标颜色</label><input type="color" id="stop-color" value="#ffffff"></div>' +
    '<div class="note">点渐变条加色标；拖动改位置；双击用上方颜色改色。</div>'
  html+='<div class="actions"><button id="btn-preview">预览</button>' +
    '<button id="btn-apply-clip"'+(state.hasImage?'':' disabled')+'>应用 → 剪贴板</button>' +
    '<button id="btn-apply" class="primary"'+(state.hasImage?'':' disabled')+'>应用并贴回</button></div>' +
    '<div class="actions"><button id="btn-undo">撤销</button><button id="btn-redo">重做</button><button id="btn-reset">复位</button></div>' +
    '<div class="row checkbox" style="margin-top:10px"><label><input type="checkbox" id="auto-paste"' +
    (state.autoPaste?' checked':'')+'> 应用后自动贴回</label></div>'
  box.innerHTML=html
  bindParams(eff)
  if (state.page==='filter') renderFilterGrid()
  if (state.effect==='curves') setupCurve()
  if (state.effect==='gradientMap') setupGradient()
}
function renderParamRows(eff) {
  var host=document.getElementById('param-rows'); if(!host)return
  host.innerHTML=eff.params.map(function(p){
    var val=state.params[p[0]]==null?p[5]:state.params[p[0]]
    var step=Math.abs(p[4])<1?0.05:1
    return '<div class="row"><label><span>'+p[1]+'</span><span id="v-'+p[0]+'">'+val+'</span></label>' +
      '<input type="range" data-key="'+p[0]+'" min="'+p[3]+'" max="'+p[4]+'" step="'+step+'" value="'+val+'"></div>'
  }).join('')
  host.querySelectorAll('input[type=range]').forEach(function(el){
    el.oninput=function(){
      var key=el.dataset.key
      state.params[key]=Number(el.value)
      var label=document.getElementById('v-'+key); if(label)label.textContent=el.value
      send('param',{page:state.page,effect:state.effect,key:key,value:state.params[key]})
    }
    el.onchange=function(){doPreview()}
  })
}
function bindParams(eff) {
  document.querySelectorAll('#effect-grid button').forEach(function(b){
    b.onclick=function(){
      state.effect=b.dataset.effect
      var e=currentDef().effects.find(function(x){return x.id===state.effect})
      state.params=paramsFor(e)
      if(state.effect==='curves')state.curvePoints=null
      if(state.effect==='gradientMap')state.gradientStops=[{pos:0,color:[0,0,0]},{pos:1,color:[255,255,255]}]
      renderParams()
    }
  })
  var fg=document.getElementById('filter-group')
  if(fg)fg.onchange=function(){state.filterGroup=this.value;renderFilterGrid()}
  renderParamRows(eff)
  document.getElementById('btn-preview').onclick=doPreview
  document.getElementById('btn-apply-clip').onclick=function(){doApply(false)}
  document.getElementById('btn-apply').onclick=function(){doApply(true)}
  document.getElementById('btn-undo').onclick=function(){send('undo')}
  document.getElementById('btn-redo').onclick=function(){send('redo')}
  document.getElementById('btn-reset').onclick=function(){send('reset')}
  document.getElementById('auto-paste').onchange=function(){state.autoPaste=!!this.checked}
}
function effectPayload() {
  var p=Object.assign({},state.params)
  if(state.effect==='curves'&&state.curvePoints)p.points=state.curvePoints
  if(state.effect==='gradientMap')p.stops=state.gradientStops
  if(state.selectionActive)p.mask=true
  return {page:state.page,effect:state.effect,params:p,tool:state.effect}
}
function doPreview(){send('preview',effectPayload())}
function doApply(paste){send('apply',Object.assign(effectPayload(),{paste:paste}))}
function renderFilterGrid() {
  var grid=document.getElementById('filter-grid'); if(!grid)return
  var ids=Object.keys(state.filterThumbs).filter(function(id){
    var f=state.filterThumbs[id]
    return state.filterGroup==='全部'||(f&&f.group===state.filterGroup)
  })
  grid.innerHTML=ids.map(function(id){
    var f=state.filterThumbs[id]

// ---- 曲线 / 渐变编辑器 ----
function setupCurve() {
  var c=document.getElementById('curve'); if(!c)return
  if(!state.curvePoints)state.curvePoints=[
    {x:0,y:0},{x:0.25,y:0.22},{x:0.5,y:0.5},{x:0.75,y:0.78},{x:1,y:1}]
  var ctx=c.getContext('2d'), drag=-1
  function xy(p){return [p.x*c.width,(1-p.y)*c.height]}
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1
    for(var i=0;i<=4;i++){var x=i/4*c.width,y=i/4*c.height
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
    ctx.strokeStyle='#7aa2ff';ctx.lineWidth=2;ctx.beginPath()
    state.curvePoints.forEach(function(p,i){var q=xy(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])})
    ctx.stroke();ctx.fillStyle='#fff'
    state.curvePoints.forEach(function(p){var q=xy(p);ctx.beginPath();ctx.arc(q[0],q[1],4,0,7);ctx.fill()})
  }
  function pos(e){var r=c.getBoundingClientRect()
    return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))}}
  c.onpointerdown=function(e){
    var p=pos(e),idx=-1
    state.curvePoints.forEach(function(q,i){if(Math.abs(q.x-p.x)<.05&&Math.abs(q.y-p.y)<.06)idx=i})
    if(idx>=0)drag=idx
    else if(e.button===0){state.curvePoints.push(p);state.curvePoints.sort(function(a,b){return a.x-b.x});draw();doPreview()}
  }
  c.onpointermove=function(e){
    if(drag<0)return
    var p=pos(e)
    if(drag===0||drag===state.curvePoints.length-1)p.x=state.curvePoints[drag].x
    state.curvePoints[drag]=p;draw();doPreview()
  }
  c.onpointerup=function(){drag=-1}
  c.oncontextmenu=function(e){
    e.preventDefault();var p=pos(e),idx=-1
    state.curvePoints.forEach(function(q,i){if(Math.abs(q.x-p.x)<.05&&Math.abs(q.y-p.y)<.06)idx=i})
    if(idx>0&&idx<state.curvePoints.length-1){state.curvePoints.splice(idx,1);draw();doPreview()}
  }
  draw()
}
function setupGradient() {
  var c=document.getElementById('gradient'); if(!c)return
  var ctx=c.getContext('2d'),drag=-1
  function draw(){
    var g=ctx.createLinearGradient(0,0,c.width,0)
    state.gradientStops.slice().sort(function(a,b){return a.pos-b.pos}).forEach(function(s){
      g.addColorStop(s.pos,'rgb('+s.color.join(',')+')')})
    ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height-10);ctx.fillStyle='#fff'
    state.gradientStops.forEach(function(s){ctx.fillRect(s.pos*c.width-3,c.height-10,6,6)})
  }
  function pos(e){var r=c.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}
  c.onpointerdown=function(e){
    var p=pos(e),hit=-1
    state.gradientStops.forEach(function(s,i){if(Math.abs(s.pos-p)<.03)hit=i})
    if(hit>=0)drag=hit
    else{document.getElementById('stop-color').value='#ffffff';state.gradientStops.push({pos:p,color:[255,255,255]});drag=state.gradientStops.length-1}
    draw();doPreview()
  }
  c.onpointermove=function(e){if(drag<0)return;state.gradientStops[drag].pos=pos(e);draw();doPreview()}
  c.onpointerup=function(){drag=-1}
  c.ondblclick=function(e){
    var p=pos(e),hit=-1
    state.gradientStops.forEach(function(s,i){if(Math.abs(s.pos-p)<.03)hit=i})
    if(hit>=0){var v=document.getElementById('stop-color').value
      state.gradientStops[hit].color=[parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)]
      draw();doPreview()}
  }
  document.getElementById('stop-color').onchange=function(){
    var v=this.value,last=state.gradientStops[state.gradientStops.length-1]
    last.color=[parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)]
    draw();doPreview()
  }
  draw()
}

function hsvToRgb(h,s,v){
  var c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r,g,b
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]
}
function setupLab(){
  var c=document.getElementById('lab-plane');if(!c)return
  var ctx=c.getContext('2d')
  request('colorPlane',{L:state.lab.L,w:c.width,h:c.height},function(r){
    if(r&&r.dataUrl){var im=new Image();im.onload=function(){ctx.drawImage(im,0,0)};im.src=r.dataUrl}
  })
  c.onclick=function(e){
    var r=c.getBoundingClientRect()
    state.lab.a=((e.clientX-r.left)/r.width-0.5)*200
    state.lab.b=((e.clientY-r.top)/r.height-0.5)*200
    request('color',{from:'lab',value:[state.lab.L,state.lab.a,state.lab.b]},function(res){
      if(res&&res.hex){state.lab.hex=res.hex;updateLabInfo();toast('取到 '+res.hex+'，可在 SAI2 取色器输入')}
    })
  }
  updateLabInfo()
}
function updateLabInfo(){
  var el=document.getElementById('lab-info');if(el)
    el.textContent='L '+Math.round(state.lab.L)+' · a '+state.lab.a.toFixed(0)+' · b '+state.lab.b.toFixed(0)+(state.lab.hex?' · '+state.lab.hex:'')
}
function setupTriad(){
  var c=document.getElementById('triad');if(!c)return
  var ctx=c.getContext('2d')
  function css(h,s,v){return 'rgb('+hsvToRgb(h,s,v).join(',')+')'}
  function draw(){
    ctx.clearRect(0,0,c.width,c.height)
    var cx=c.width/2,cy=c.height-12,R=Math.min(c.width/2-8,c.height-24)
    for(var a=0;a<360;a+=2){ctx.strokeStyle='hsl('+a+',100%,50%)';ctx.lineWidth=2
      ctx.beginPath();ctx.arc(cx,cy,R,(a-1)*Math.PI/180,(a+1)*Math.PI/180);ctx.stroke()}
    ctx.fillStyle=css(state.triadH,0,1);ctx.beginPath()
    ctx.moveTo(cx,cy-R);ctx.lineTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.fill()
    var g=ctx.createLinearGradient(cx-R,cy,cx+R,cy)
    g.addColorStop(0,css(state.triadH,1,0));g.addColorStop(1,'rgba(0,0,0,0)')
    ctx.globalCompositeOperation='source-atop';ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height)
    ctx.globalCompositeOperation='source-over'
    var x=cx+(state.triadS-0.5)*R,y=cy-(1-state.triadV)*R
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.stroke()
    var rgb=hsvToRgb(state.triadH,state.triadS,state.triadV)
    document.getElementById('triad-info').textContent='H '+state.triadH+'° S '+state.triadS.toFixed(2)+' V '+state.triadV.toFixed(2)+
      ' · #'+rgb.map(function(n){return n.toString(16).padStart(2,'0')}).join('').toUpperCase()
  }
  c.onclick=function(e){
    var r=c.getBoundingClientRect(),cx=c.width/2,cy=c.height-12,R=Math.min(c.width/2-8,c.height-24)
    var x=(e.clientX-r.left)*(c.width/r.width),y=(e.clientY-r.top)*(c.height/r.height)
    var dx=x-cx,dy=y-cy,ang=Math.atan2(dy,dx)*180/Math.PI+90
    if(Math.hypot(dx,dy)>R*0.9){state.triadH=(ang+360)%360}
    else{state.triadS=Math.max(0,Math.min(1,dx/R+0.5));state.triadV=Math.max(0,Math.min(1,1-dy/R))}
    draw()
  }
  draw()
}

function paint(){
  if(!state.imageUrl)return
  var img=new Image()
  img.onload=function(){
    var pv=document.getElementById('preview'),ov=document.getElementById('overlay'),area=document.getElementById('canvas-area')
    var maxW=Math.max(80,area.clientWidth-24),maxH=Math.max(80,area.clientHeight-24)
    var fit=Math.min(1,maxW/img.width,maxH/img.height),s=fit*state.zoom/100
    pv.width=Math.max(1,Math.round(img.width*s));pv.height=Math.max(1,Math.round(img.height*s))
    pv.getContext('2d').drawImage(img,0,0,pv.width,pv.height)
    pv.style.display='block';document.getElementById('empty').style.display='none'
    pv.style.left=Math.round((area.clientWidth-pv.width)/2)+'px'
    pv.style.top=Math.round((area.clientHeight-pv.height)/2)+'px'
    ov.style.left=pv.style.left;ov.style.top=pv.style.top
  }
  img.src=state.imageUrl
}
function canvasPoint(e){
  var r=document.getElementById('preview').getBoundingClientRect()
  return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}
}
function bindCanvas(){
  var area=document.getElementById('canvas-area'),last=null,dragTool=null,dragPts=null
  area.addEventListener('pointerdown',function(e){
    if(!state.hasImage)return
    var p=canvasPoint(e)
    if(state.page==='liquify'){
      last=p
      send('liquifyStroke',{tool:state.effect,from:p,to:p,radius:Number(state.params.radius||24),amount:Number(state.params.amount||1)})
      state.stats.strokes++;renderStats()
    }else if(state.page==='selection'){
      last=p;dragPts=[p]
      dragTool=e.altKey?'lasso':(e.ctrlKey&&e.shiftKey?'ellipse':(e.shiftKey?'rect':state.selectionTool))
    }
  })
  area.addEventListener('pointermove',function(e){
    if(!last)return
    var p=canvasPoint(e)
    if(state.page==='liquify'){
      send('liquifyStroke',{tool:state.effect,from:last,to:p,radius:Number(state.params.radius||24),amount:Number(state.params.amount||1)})
      last=p
    }else if(state.page==='selection'&&dragPts)dragPts.push(p)
  })
  window.addEventListener('pointerup',function(e){
    if(!last)return
    if(state.page==='selection'&&dragPts){
      var p=canvasPoint(e)
      if(dragTool==='magicWand'||dragTool==='pen')send('selection',{op:dragTool,points:dragPts})
      else send('selection',{op:dragTool,from:dragPts[0],to:p,points:dragPts})
      state.selectionActive=true
    }
    last=null;dragPts=null;dragTool=null
  })
}

  document.getElementById('side').hidden = true
  if (!bridge) {
    // 侧栏页跑在沙箱 iframe 里，拿不到 pluginBridge，只做界面展示
    var soloHint = document.getElementById('solo-hint')
    if (soloHint) soloHint.hidden = false
    var soloOpen = document.getElementById('solo-open')
    if (soloOpen) soloOpen.onclick = function () {
      window.parent.postMessage({ __sai2Page: 'action', id: 'fx-open-panel' }, '*')
    }
  }
}
document.querySelectorAll('#side button[data-page]').forEach(function (b) {
  b.classList.toggle('active', b.dataset.page === state.page)
})

if (bridge) send('filterList')
renderParams()
})()
</script>
</body>
</html>
